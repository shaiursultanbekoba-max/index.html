<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Кнопка</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f2f2f2;
    font-family: Arial;
  }

  .container {
    text-align: center;
  }

  button {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: none;
    background: red;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }

  #data {
    margin-top: 20px;
    display: none;
    font-size: 18px;
  }
</style>
</head>
<body>

<div class="container">
  <button onclick="showData()">Жми</button>
  <div id="data">Вот данные 🔥</div>
</div>

<script>
function showData() {
  document.getElementById("data").style.display = "block";
}
</script>

</body>
</html>
